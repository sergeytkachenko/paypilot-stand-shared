  $('ovTitle').textContent = t('ovTitle', {p: armName(), c: 'clean'});
  $('pmProfile').textContent = t('tabProfile', {p: armName()});
  $('pmClean').textContent = t('tabClean');
  $('dmChanges').setAttribute('aria-pressed', String(!diffAll));
  $('dmAll').setAttribute('aria-pressed', String(diffAll));
  $('diffMode').hidden = mode !== 'diff';
  $('ovSide').hidden = mode !== 'diff';
  $('ovBody').classList.toggle('single', mode !== 'diff');
  const box = $('promptBox');
  try{
    const pair = await Promise.all([
      api('/api/_test/prompt'),
      api('/api/_test/prompt', {headers: cleanSettingsHeader()})]);
    if(ticket !== promptRequest) return;
    const mine = pair[0], clean = pair[1];
    const diff = lineDiff(clean.text.split('\n'), mine.text.split('\n'));
    const added = diff.filter(function(l){ return l.op === 'add'; }).length;
    const removed = diff.filter(function(l){ return l.op === 'del'; }).length;
    if(mode === 'diff'){
      if(added || removed) renderPromptLines(box, diffAll ? diff : withContext(diff, 2));
      else box.textContent = t('promptSame', {p: currentProfile});
      renderOverviewSide(added, removed);
    }else{
      box.textContent = (mode === 'clean' ? clean : mine).text;
    }
    const shown = mode === 'clean' ? clean : mine;
    $('promptMeta').textContent = (mode === 'diff' ? clean.version + ' → ' + mine.version : shown.version) +
      ' · ' + t('linesFromClean', {a: added, d: removed});
  }catch(e){ fail(e); }
}

function renderOverviewSide(added, removed){
  const side = $('ovSide');
  side.textContent = '';
  if(activeCount === 0){ side.appendChild(el('p', {cls: 'note', text: t('ovClean')})); return; }
  side.appendChild(el('div', {cls: 'sec'}, [el('span', {cls: 'k', text: t('ovLines')}),
    el('div', {cls: 'counts'}, [el('span', {cls: 'a', text: '+' + added}), el('span', {cls: 'd', text: '−' + removed})])]));
  const ids = Array.from(new Set(Array.from(profileDefects).concat(Array.from(extraDefects)))).sort();
  const layers = {};
  ids.forEach(function(id){ const l = (defectDetails[id] || {}).layer; if(l) layers[l] = (layers[l] || 0) + 1; });
  const names = t('layerNames') || {};
  const ls = el('div', {cls: 'sec'}, [el('span', {cls: 'k', text: t('ovLayers')})]);
  if(Object.keys(layers).length){
    const g = el('div', {cls: 'layers'});
    Object.keys(layers).sort().forEach(function(l){
      g.appendChild(el('span', {text: names[l] || l}));
      g.appendChild(el('span', {cls: 'mono', text: String(layers[l])}));
    });
    ls.appendChild(g);
    ls.appendChild(el('span', {cls: 'note', text: t('ovLayersNote')}));
  }else{
    ls.appendChild(el('span', {cls: 'note', text: t('ovNoLayers')}));
  }
  side.appendChild(ls);
  side.appendChild(el('div', {cls: 'sec'}, [el('span', {cls: 'k', text: t('ovDefects')}),
    el('span', {cls: 'mono', text: ids.length ? ids.join(', ') : t('none')})]));
  const m = /^lesson-(\d+)$/.exec(currentProfile);
  if(m) side.appendChild(el('div', {cls: 'sec'}, [el('span', {cls: 'k', text: t('ovLessons')}), el('span', {cls: 'tag-r mono', style: 'align-self:flex-start', text: 'L' + m[1]})]));
}

function openOverview(){ closePops(); showPrompt('diff'); }
function toggleFull(){ $('overview').classList.toggle('full'); }

async function resetState(){
  try{
    const r = await api('/api/_test/reset', {method:'POST'});
    closePops();
    newSession();
    addMsg(t('stateReset', {v: r.seed_version, c: r.customers, a: r.accounts, t: r.transactions}), 'sys');
  }catch(e){ fail(e); }
}

async function loadSeed(){
  try{
    const s = await api('/api/_test/seed');
    customers = s.customers;
    accountsOf = {};
    s.accounts.forEach(function(a){
      if(!accountsOf[a.customer_id]) accountsOf[a.customer_id] = [];
      accountsOf[a.customer_id].push(a);
    });
    const tiers = {};
    s.customers.forEach(function(c){ tiers[c.tier] = (tiers[c.tier] || 0) + 1; });
    const holds = s.customers.filter(function(c){ return c.compliance_hold; }).length;
    $('seedSum').textContent = s.customers.length + ' · ' + s.accounts.length + ' · ' + s.transaction_count + ' — ' +
      Object.keys(tiers).sort().map(function(k){ return k + ' ×' + tiers[k]; }).join(', ') +
      (holds ? ' · compliance hold: ' + holds : '');
    $('seedSum').title = 'customers · accounts · transactions';
    if(ui.customer && !customers.some(function(c){ return c.id === ui.customer; })){ ui.customer = ''; saveUi(); }
    renderCustomers();
  }catch(e){ $('seed').textContent = t('unavailable'); }
}

function customerTier(){
  const c = customers.filter(function(x){ return x.id === ui.customer; })[0];
  return c ? c.tier : '';
}

function renderCustomers(){
  const box = $('seed');
  box.textContent = '';
  const row = function(id, tier, acc, hold, value){
    const r = el('div', {cls: 'cust-row', role: 'option', 'aria-selected': String(ui.customer === value), tabindex: '0'}, [
      el('span', {text: id}), el('span', {cls: 'muted', text: tier}), el('span', {cls: 'muted', text: acc}),
      el('span', {style: 'color:var(--err)', text: hold})]);
    r.onclick = function(){ pickCustomer(value); };
    r.onkeydown = function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pickCustomer(value); } };
    box.appendChild(r);
  };
  row('—', t('noCustomer'), '', '', '');
  customers.forEach(function(c){
    row(c.id, c.tier, (accountsOf[c.id] || []).map(function(a){ return a.id + ' ' + a.currency; }).join(', '), c.compliance_hold ? 'hold' : '', c.id);
  });
  const tier = customerTier();
  $('custLabel').textContent = ui.customer ? ui.customer + (tier ? ' · ' + tier : '') : t('noCustomer');
}

function pickCustomer(id){
  const switched = ui.customer !== id;
  if(switched){ sessionId = null; lastStep = 0; }
  ui.customer = id;
  saveUi();
  renderCustomers();
  if(switched) renderComposerHint();
  closePops();
  $('inp').focus();
}

function openCustomers(){ togglePop('custPop', $('custBtn'), true); }

function refTable(title, head, rows, hit){
  const wrap = el('div', {cls: 'sec'}, [el('h3', {text: title})]);
  const tb = el('table');
  const h = el('tr');
  head.forEach(function(cell, i){ h.appendChild(el('th', {cls: i ? 'num' : '', text: cell})); });
  tb.appendChild(h);
  rows.forEach(function(r){
    const tr = el('tr', {cls: r[0] === hit ? 'hit' : ''});
    r.forEach(function(cell, i){ tr.appendChild(el('td', {cls: i ? 'num' : '', text: cell})); });
    tb.appendChild(tr);
  });
  wrap.appendChild(tb);
  return wrap;
}

async function loadReference(){
  try{
    reference = await api('/api/_test/reference');
    renderReference('');
  }catch(e){ $('ref').textContent = t('unavailable') + ': ' + e.message; }
}

function renderReference(hit){
  const box = $('ref');
  const r = reference;
  if(!r){ box.textContent = t('loading'); return; }
  box.textContent = '';
  const tiers = Object.keys(r.FX_SPREAD_PCT).sort();
  const num = function(v){ return Number(v).toLocaleString(ui.lang === 'en' ? 'en-US' : 'uk-UA'); };
  box.appendChild(refTable(t('refFx'), [t('tier'), t('spread'), t('freeFx')],
    tiers.map(function(k){ return [k, String(r.FX_SPREAD_PCT[k]), num(r.FX_FREE_MONTHLY_ALLOWANCE_EUR[k])]; }), hit));
  box.appendChild(refTable(t('refLimits'), [t('tier'), t('perDay'), t('perMonth')],
    tiers.map(function(k){ return [k, num(r.DAILY_LIMIT_EUR[k]), num(r.MONTHLY_LIMIT_EUR[k])]; }), hit));
  box.appendChild(refTable(t('refFees'), [t('type'), t('flat'), t('pct')],
    Object.keys(r.TRANSFER_FEES).map(function(k){
      const f = r.TRANSFER_FEES[k];
      return [k, String(f.flat_fee_eur), String(f.percent_fee)];
    }), hit));
  box.appendChild(refTable(t('refDisputes'), [t('reason'), t('days')],
    Object.keys(r.DISPUTE_WINDOWS_DAYS).map(function(k){ return [k, String(r.DISPUTE_WINDOWS_DAYS[k])]; }), hit));
  box.appendChild(refTable(t('refRates'), [t('currency'), 'EUR'],
    Object.keys(r.RATES_TO_EUR).map(function(k){ return [k, String(r.RATES_TO_EUR[k])]; }), hit));
}

function openReference(hit){
  $('advPanel').hidden = true;
  renderReference(hit || customerTier());
  $('refDrawer').hidden = false;
}
function closeReference(){
  $('refDrawer').hidden = true;
  document.querySelectorAll('.actions button[aria-pressed]').forEach(function(b){ b.setAttribute('aria-pressed', 'false'); });
}
function openAdvanced(){
  $('refDrawer').hidden = true;
  $('advPanel').hidden = false;
  if(!lastTrace) $('tree').textContent = t('traceEmpty');
}
function closeAdvanced(){ $('advPanel').hidden = true; }

let openPop = null, popJustOpened = false;
function togglePop(id, btn, forceOpen){
  const pop = $(id);
  const willOpen = forceOpen || pop.hidden;
  closePops();
  if(!willOpen) return;
  pop.hidden = false;
  if(btn) btn.setAttribute('aria-expanded', 'true');
  openPop = {pop: pop, btn: btn};
  popJustOpened = true;
  setTimeout(function(){ popJustOpened = false; }, 0);
}
function closePops(){
  ['profileList', 'menu', 'lectPop', 'custPop'].forEach(function(id){ $(id).hidden = true; });
  ['profileBtn', 'menuBtn', 'custBtn'].forEach(function(id){ $(id).setAttribute('aria-expanded', 'false'); });
  openPop = null;
}
document.addEventListener('click', function(e){
  if(!openPop || popJustOpened) return;
  if(openPop.pop.contains(e.target) || (openPop.btn && openPop.btn.contains(e.target))) return;
  closePops();
});
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  if(openPop){ const b = openPop.btn; closePops(); if(b) b.focus(); return; }
  if(!$('overview').hidden){ showPrompt(null); return; }
  if(!$('refDrawer').hidden){ closeReference(); return; }
  if(!$('advPanel').hidden) closeAdvanced();
});

function applyTheme(){
  const root = document.documentElement;
  if(ui.theme) root.setAttribute('data-theme', ui.theme); else root.removeAttribute('data-theme');
  if(ui.projector) root.setAttribute('data-scale', 'projector'); else root.removeAttribute('data-scale');
  const dark = ui.theme ? ui.theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  $('themeLight').setAttribute('aria-pressed', String(!dark));
  $('themeDark').setAttribute('aria-pressed', String(dark));
  $('projBtn').setAttribute('aria-checked', String(!!ui.projector));
}
function setTheme(v){ ui.theme = v; saveUi(); applyTheme(); }
function toggleProjector(){ ui.projector = !ui.projector; saveUi(); applyTheme(); }

function applyLang(){
  document.documentElement.lang = ui.lang;
  document.querySelectorAll('[data-i18n]').forEach(function(n){ n.textContent = t(n.getAttribute('data-i18n')); });
  $('langUk').setAttribute('aria-pressed', String(ui.lang === 'uk'));
  $('langEn').setAttribute('aria-pressed', String(ui.lang === 'en'));
  $('adminInp').placeholder = t('tokenPh');
  $('custBtn').title = t('custTip');
  $('whatDiffers').textContent = t('whatDiffers');
  if(currentProfile !== '—') $('profileDesc').textContent = profileDesc(currentProfile);
  renderProfileList();
  renderSpend();
  renderCustomers();
  if(reference) renderReference('');
  if(lastTrace) renderTree(lastTrace);
  renderComposerHint();
  renderEmpty();
}
function setLang(v){ ui.lang = v; saveUi(); applyLang(); refreshState(); }

const EXAMPLES = ['Convert 6000 EUR to USD.', 'What are my daily and monthly transfer limits?', 'What is the fee for a SWIFT transfer of 1,000 EUR?'];

function renderEmpty(){
  const msgs = $('msgs');
  const old = $('emptyState');
  if(msgs.querySelector('.msg.user, .card') ) { if(old) old.remove(); return; }
  const box = el('div', {cls: 'empty', id: 'emptyState'});
  box.appendChild(el('h1', {text: t('emptyTitle')}));
  if(activeCount <= 0) box.appendChild(el('p', {text: t('emptyClean')}));
  else{
    const p = el('p');
    const parts = t('emptyBody').split(/(\{c\}|\{p\})/);
    parts.forEach(function(s){
      if(s === '{c}') p.appendChild(el('code', {text: 'clean'}));
      else if(s === '{p}') p.appendChild(el('code', {text: armName()}));
      else if(s) p.appendChild(document.createTextNode(s));
    });
    box.appendChild(p);
  }
  const ex = el('div', {cls: 'examples'}, [el('span', {cls: 'muted', text: t('tryLabel')})]);
  EXAMPLES.forEach(function(q){
    ex.appendChild(el('button', {text: q, onclick: function(){
      if(!ui.customer && customers.length) pickCustomer('CUS-0005');
      $('inp').value = q;
      $('inp').focus();
    }}));
  });
  box.appendChild(ex);
  box.appendChild(el('p', {cls: 'note', text: t('emptyNote')}));
  if(old) old.replaceWith(box); else msgs.appendChild(box);
}

$('inp').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    if(e.metaKey || e.ctrlKey || sessionId || onBaseline()) send(); else compare();
  }
});

applyTheme();
applyLang();
renderSpend();
refreshState();
loadSeed();
loadReference();
$('inp').focus();
</script>
</body>
</html>
