<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayPilot — навчальний стенд</title>
<style>
  :root{
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --fs-xs:12px; --fs-sm:13px; --fs-body:15px; --fs-md:17px; --fs-lg:20px; --fs-xl:26px;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
    --r-sm:6px; --r:10px; --r-lg:14px;
    --bg:#f5f9fe; --surface:#ffffff; --surface-2:#eaf3fc; --line:#dce7f2; --line-strong:#bfd0e3;
    --text:#1a2530; --muted:#4b5a6b; --accent:#283593; --on-accent:#ffffff; --accent-bg:#e8eaf6;
    --focus-ring:rgba(40,53,147,.28); --user-bg:#e3f2fd;
    --left:#1b5e96; --left-bg:#e3f2fd; --left-line:#aed0ee;
    --right:#7b2c8f; --right-bg:#f3e5f5; --right-line:#dbb6e4;
    --add:#1b6b47; --add-bg:#d9f2e6; --del:#a23434; --del-bg:#fde3e2;
    --warn:#855000; --warn-bg:#fff3d9; --warn-line:#efcf8c;
    --err:#b0283a; --err-bg:#fde4e7; --err-line:#f2b3bc; --ok:#1d7748; --ok-bg:#dcf4e7;
    --shadow:0 12px 32px rgba(20,30,60,.18);
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#17161f; --surface:#1f1e2a; --surface-2:#2a2836; --line:#34323f; --line-strong:#45425a;
    --text:#ecebf3; --muted:#aeaac0; --accent:#b7a9ff; --on-accent:#1a1530; --accent-bg:#2c2748;
    --focus-ring:rgba(183,169,255,.45); --user-bg:#26324a;
    --left:#9ccbf5; --left-bg:#1b2a3c; --left-line:#34557a;
    --right:#f5a9c8; --right-bg:#3a1f2d; --right-line:#7a4560;
    --add:#a8ecc8; --add-bg:#1d4434; --del:#ffb5b0; --del-bg:#4a2424;
    --warn:#f7cf8a; --warn-bg:#352b17; --warn-line:#6e5a2e;
    --err:#ffa3ad; --err-bg:#3d1f24; --err-line:#7d3a44; --ok:#9be3bd; --ok-bg:#1a3b2e;
    --shadow:0 12px 32px rgba(0,0,0,.45);
    color-scheme:dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17161f; --surface:#1f1e2a; --surface-2:#2a2836; --line:#34323f; --line-strong:#45425a;
      --text:#ecebf3; --muted:#aeaac0; --accent:#b7a9ff; --on-accent:#1a1530; --accent-bg:#2c2748;
      --focus-ring:rgba(183,169,255,.45); --user-bg:#26324a;
      --left:#9ccbf5; --left-bg:#1b2a3c; --left-line:#34557a;
      --right:#f5a9c8; --right-bg:#3a1f2d; --right-line:#7a4560;
      --add:#a8ecc8; --add-bg:#1d4434; --del:#ffb5b0; --del-bg:#4a2424;
      --warn:#f7cf8a; --warn-bg:#352b17; --warn-line:#6e5a2e;
      --err:#ffa3ad; --err-bg:#3d1f24; --err-line:#7d3a44; --ok:#9be3bd; --ok-bg:#1a3b2e;
      --shadow:0 12px 32px rgba(0,0,0,.45);
      color-scheme:dark;
    }
  }
  :root[data-scale="projector"]{
    --fs-xs:15px; --fs-sm:16px; --fs-body:19px; --fs-md:22px; --fs-lg:26px; --fs-xl:32px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--text);
       font:var(--fs-body)/1.5 var(--sans)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;box-shadow:0 0 0 4px var(--focus-ring)}
  button{font:var(--fs-sm) var(--sans);color:var(--text);background:var(--surface-2);
         border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:7px 12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button:disabled,button[aria-disabled="true"]{opacity:.5;cursor:default}
  button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
  button.link{background:none;border:none;padding:0;color:var(--accent);text-decoration:underline;
              text-underline-offset:3px}
  button.quiet{background:none;border:1px solid var(--line-strong);color:var(--muted);padding:0 6px;
               border-radius:4px;font:inherit}
  a{color:var(--accent)}
  code,.mono{font-family:var(--mono)}
  code{font-size:.92em;background:var(--surface-2);padding:0 4px;border-radius:4px}
  input,select{font:var(--fs-body) var(--sans);color:var(--text);background:var(--bg);
               border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:7px 9px;min-width:0}
  .muted{color:var(--muted)}
  .grow{flex:1}
  .caret{color:var(--muted);font-size:10px}
  .pop{position:absolute;z-index:20;background:var(--surface-2);border:1px solid var(--line-strong);
       border-radius:var(--r);box-shadow:var(--shadow)}
  [hidden]{display:none !important}

  .top{position:relative;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);
       display:flex;align-items:center;gap:var(--s4);padding:var(--s2) var(--s5);min-height:64px;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;line-height:1.15;flex:none}
  .brand-name{font-size:var(--fs-lg);font-weight:700;letter-spacing:-.01em}
  .brand-sub{font-size:var(--fs-xs);color:var(--muted)}
  .vsep{width:1px;align-self:stretch;background:var(--line);margin:4px 0}
  .prof{display:flex;align-items:center;gap:var(--s3);min-width:0;flex:0 1 auto}
  .prof-pick{position:relative;display:flex;flex-direction:column;gap:2px;flex:none}
  .lbl{font-size:var(--fs-xs);color:var(--muted)}
  #profileBtn{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:150px;
              white-space:nowrap;padding:6px 10px;font:600 var(--fs-md)/1.2 var(--mono)}
  .prof-desc{display:flex;flex-direction:column;gap:2px;max-width:340px;min-width:0;font-size:var(--fs-sm);line-height:1.35}
  .prof-desc a{text-decoration:none}
  #profileList{top:calc(100% + 6px);left:0;width:380px;max-height:70vh;overflow:auto;padding:4px 0}
  .opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;background:none;
       border:none;border-radius:0;padding:8px 14px;text-align:left}
  .opt:hover,.opt[aria-selected="true"]{background:var(--accent-bg)}
  .opt b{font:600 var(--fs-sm) var(--mono)}
  .opt span{font-size:var(--fs-xs);color:var(--muted)}
  .chip-warn{display:flex;align-items:center;gap:8px;background:var(--warn-bg);border:1px solid var(--warn-line);
             color:var(--warn);border-radius:99px;padding:3px 4px 3px 10px;font-size:var(--fs-sm);flex:none}
  .chip-warn button{background:var(--warn);color:var(--warn-bg);border:none;border-radius:99px;padding:3px 10px;
                    font:600 var(--fs-xs) var(--sans)}
  .bang{width:16px;height:16px;border-radius:50%;background:var(--warn);color:var(--warn-bg);display:grid;
        place-items:center;font:700 11px var(--sans);flex:none}
  .spend{font:var(--fs-sm) var(--mono);color:var(--muted);border-bottom:1px dotted var(--line-strong);cursor:help;flex:none}
  .menu-wrap{position:relative;flex:none}
  #menuBtn{display:flex;align-items:center;gap:8px}
  .menu{right:0;top:calc(100% + 6px);width:330px;padding:6px 0;display:flex;flex-direction:column}
  .mi{display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:none;
      border-radius:0;padding:9px 14px;text-align:left;width:100%;color:var(--text);text-decoration:none;font-size:var(--fs-sm)}
  button.mi:hover,a.mi:hover{background:var(--accent-bg)}
  .mi small{display:block;color:var(--muted);font-size:var(--fs-xs)}
  .msep{height:1px;background:var(--line);margin:6px 0}
  .seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px}
  .seg button{background:transparent;border:none;border-radius:4px;padding:4px 10px;font:600 var(--fs-xs) var(--sans);color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text)}
  .badge{background:var(--warn);color:var(--warn-bg);border-radius:99px;padding:0 7px;font:600 var(--fs-xs) var(--mono)}
  .switch{width:32px;height:18px;border-radius:99px;background:var(--line-strong);position:relative;flex:none;display:inline-block}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
  [aria-checked="true"] .switch,[aria-pressed="true"] .switch{background:var(--accent)}
  [aria-checked="true"] .switch::after,[aria-pressed="true"] .switch::after{left:16px}
  .lect{right:var(--s5);top:calc(100% - 4px);width:360px;padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
  .lect h3{margin:0;font-size:var(--fs-md)}
  .danger{display:flex;flex-direction:column;gap:4px;padding:var(--s3);border:1px solid var(--err-line);
          border-radius:var(--r-sm);background:var(--err-bg);color:var(--err);font-size:var(--fs-xs)}
  .danger button{align-self:flex-start;background:var(--err);color:var(--err-bg);border:none;font-weight:600}

  .body{flex:1;display:flex;min-height:0}
  .chat{flex:1;display:flex;flex-direction:column;min-width:0}
  .scroller{flex:1;overflow-y:auto}
  .msgs{max-width:1100px;margin:0 auto;padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4)}
  .msg{max-width:min(760px, 100%);padding:10px 14px;border-radius:var(--r);white-space:pre-wrap;
       word-wrap:break-word;overflow-wrap:anywhere}
  .msg.user{align-self:flex-end;background:var(--user-bg)}
  .msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
  .msg.sys{align-self:center;color:var(--muted);font-size:var(--fs-sm);background:none;border:1px dashed var(--line-strong)}
  .msg.err{align-self:center;font-size:var(--fs-sm);background:var(--err-bg);color:var(--err);border:1px solid var(--err-line)}
  .cust-tag{display:inline-block;font:var(--fs-xs) var(--mono);background:var(--surface);border:1px solid var(--line);
            color:var(--muted);border-radius:4px;padding:0 6px;margin-right:8px;vertical-align:1px}
  .meta{margin-top:6px;font:var(--fs-xs) var(--mono);color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .meta a{color:var(--accent);cursor:pointer;text-decoration:none}
  .wait{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:var(--fs-sm)}
  .dots{display:inline-flex;gap:3px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .stuck{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding:var(--s3);border:1px solid var(--warn-line);
         background:var(--warn-bg);color:var(--warn);border-radius:var(--r-sm);font-size:var(--fs-sm);white-space:normal}
  .alert{align-self:stretch;max-width:760px;display:flex;flex-direction:column;gap:6px;padding:var(--s3) var(--s4);
         border:1px solid var(--err-line);background:var(--err-bg);color:var(--err);border-radius:var(--r);white-space:normal;font-size:var(--fs-sm)}
  .alert b{font-size:var(--fs-body)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  .empty{margin:var(--s7) auto;max-width:720px;display:flex;flex-direction:column;gap:var(--s3)}
  .empty h1{margin:0;font-size:var(--fs-xl);line-height:1.25;letter-spacing:-.01em}
  .empty p{margin:0;color:var(--muted)}
  .examples{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:var(--s2)}
  .examples button{background:var(--surface);font-family:var(--mono)}

  .composer{border-top:1px solid var(--line);background:var(--surface);position:relative;z-index:5}
  .composer-in{max-width:1100px;margin:0 auto;padding:var(--s3) var(--s5) var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
  .inrow{display:flex;align-items:center;gap:var(--s2);background:var(--bg);border:1px solid var(--line-strong);
         border-radius:var(--r);padding:6px 6px 6px 8px;min-height:48px}
  .inrow:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-ring)}
  .inrow input{flex:1;border:none;background:transparent;padding:6px 4px;outline:none;box-shadow:none}
  .cust-wrap{position:relative;flex:none}
  .cust{display:flex;align-items:center;gap:6px;padding:4px 8px;white-space:nowrap}
  .cust .b{font-weight:600}
  .cust-pop{bottom:calc(100% + 8px);left:0;width:520px;max-width:calc(100vw - 32px);overflow:hidden}
  .cust-head{padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
  .cust-list{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;font:var(--fs-sm) var(--mono);
             padding:4px 0;max-height:46vh;overflow:auto}
  .cust-row{display:contents;cursor:pointer}
  .cust-row>span{padding:6px var(--s4) 6px 0}
  .cust-row>span:first-child{padding-left:var(--s4);font-weight:600}
  .cust-row:hover>span,.cust-row[aria-selected="true"]>span{background:var(--accent-bg)}
  .actrow{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
  #cmpBtn{padding:9px 20px;font-size:var(--fs-body)}
  .pair{display:flex;align-items:center;gap:6px;font:600 var(--fs-sm) var(--mono)}
  .tag-l{background:var(--left-bg);color:var(--left);border:1px solid var(--left-line);border-radius:var(--r-sm);padding:1px 8px}
  .tag-r{background:var(--right-bg);color:var(--right);border:1px solid var(--right-line);border-radius:var(--r-sm);padding:1px 8px}
  .cap{font-size:var(--fs-xs);color:var(--muted)}
  .warnline{display:flex;align-items:center;gap:8px;color:var(--warn);font-size:var(--fs-sm)}

  .card{align-self:stretch;max-width:none;background:var(--surface);border:1px solid var(--line-strong);
        border-radius:var(--r-lg);overflow:hidden;white-space:normal;padding:0}
  .card-head{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);flex-wrap:wrap}
  .card-head h3{margin:0;display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-md);white-space:nowrap}
  .verdict{display:flex;align-items:flex-start;gap:var(--s3);padding:0 var(--s4) var(--s3);flex-wrap:wrap}
  .verdict p{margin:0;flex:1;min-width:220px;font-size:var(--fs-md);line-height:1.45;font-weight:500}
  .vpill{flex:none;margin-top:3px;font:600 var(--fs-xs) var(--sans);text-transform:uppercase;letter-spacing:.05em;
         border-radius:99px;padding:2px 10px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--muted)}
  .vpill.diff{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
  .vpill.wait{opacity:.7}
  .pdiff{border-top:1px solid var(--line);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
  .pdiff strong{font-size:var(--fs-sm)}
  .dgrid{display:grid;grid-template-columns:minmax(160px,auto) auto auto auto minmax(0,1fr);column-gap:var(--s3);row-gap:6px;
         align-items:center;font:var(--fs-sm) var(--mono)}
  .dgrid>span{overflow-wrap:anywhere}
  .vl{justify-self:start;background:var(--left-bg);color:var(--left);border-radius:4px;padding:1px 8px}
  .vr{justify-self:start;background:var(--right-bg);color:var(--right);border-radius:4px;padding:1px 8px}
  .refnote{font-family:var(--sans);font-size:var(--fs-xs);color:var(--muted)}
  .hlbar{display:flex;align-items:center;gap:var(--s4);padding:var(--s2) var(--s4);border-top:1px solid var(--line);
         background:var(--surface-2);flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted)}
  .hlbar button{display:flex;align-items:center;gap:8px;background:none;border:none;padding:2px 0;font-size:var(--fs-sm);color:var(--text)}
  .dadd{background:var(--add-bg);color:var(--add);border-radius:3px;padding:0 2px}
  .ddel{background:var(--del-bg);color:var(--del);text-decoration:line-through;border-radius:3px;padding:0 2px}
  .cmp-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line)}
  .side-col{padding:var(--s3) var(--s4) var(--s4);display:flex;flex-direction:column;gap:var(--s2);min-width:0}
  .side-col+.side-col{border-left:1px solid var(--line)}
  .side-col.l{border-top:3px solid var(--left)}
  .side-col.r{border-top:3px solid var(--right)}
  .side-h{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);font-weight:600;flex-wrap:wrap}
  .side-h .nm{font-family:var(--mono);font-size:var(--fs-sm)}
  .l .nm{color:var(--left)} .r .nm{color:var(--right)}
  .dot{width:8px;height:8px;border-radius:2px;flex:none}
  .l .dot{background:var(--left)} .r .dot{background:var(--right)}
  .role{font-weight:400;color:var(--muted);border:1px solid var(--line-strong);border-radius:99px;padding:0 8px}
  .answer{font-size:var(--fs-body);line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
  .side-col .meta{margin-top:auto}
  .actions{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);border-top:1px solid var(--line);flex-wrap:wrap}
  .actions button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
  .details{padding:0 var(--s4) var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
  .cond{width:100%;border-collapse:collapse;font:var(--fs-xs) var(--mono);border:1px solid var(--line);border-radius:var(--r-sm)}
  .cond th,.cond td{padding:5px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);color:var(--muted)}
  .cond th{background:var(--surface-2);font-weight:600;color:var(--text)}
  .cond tr.diffrow td{color:var(--warn);font-weight:600}
  .cond tr.diffrow td:first-child{color:var(--text)}
  .cond td.mark{width:1%;white-space:nowrap}
  .explain{border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s3);display:flex;flex-direction:column;gap:6px;
           font-size:var(--fs-sm);white-space:pre-wrap}
  .explain h4,.sub-h{margin:0;font:600 var(--fs-xs) var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .explain .src{font-size:var(--fs-xs);color:var(--muted);white-space:normal}
  .raw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s2)}
  .raw pre{margin:0;background:var(--bg);border-radius:var(--r-sm);padding:var(--s2) var(--s3);
           font:var(--fs-xs)/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto}
  .raw pre.l{border:1px solid var(--left-line)} .raw pre.r{border:1px solid var(--right-line)}

  .x5t{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--arms),164px);border-top:1px solid var(--line)}
  .x5t .tr{display:contents}
  .x5t .th{padding:8px var(--s4);background:var(--surface-2);display:flex;align-items:center;gap:8px;min-width:0}
  .x5t .th.ans,.x5t .cap-row{font:600 var(--fs-xs) var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .x5t .th.arm{border-left:1px solid var(--line)}
  .x5t .th.arm b{font:600 var(--fs-sm) var(--mono)}
  .x5t .th.l{box-shadow:inset 0 3px 0 var(--left)} .x5t .th.l b{color:var(--left)}
  .x5t .th.r{box-shadow:inset 0 3px 0 var(--right)} .x5t .th.r b{color:var(--right)}
  .x5t .base{font-size:var(--fs-xs);color:var(--muted);border:1px solid var(--line-strong);border-radius:99px;padding:0 8px}
  .x5t .ans-c{padding:var(--s3) var(--s4);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:var(--s2);min-width:0}
  .x5t .what{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
  .x5t .what .o{font-weight:600}
  .x5 .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
  .x5 .dot.ok{background:var(--ok)} .x5 .dot.warn{background:var(--warn)}
  .x5t .chip{font:var(--fs-sm) var(--mono);background:var(--surface-2);border-radius:4px;padding:1px 8px}
  .x5t .chip .k{color:var(--muted)}
  .x5t .chip.warn{background:var(--warn-bg);color:var(--warn)} .x5t .chip.warn .k{color:inherit}
  .x5t .ref{font-size:var(--fs-xs);color:var(--muted)} .x5t .ref.ok{color:var(--ok)} .x5t .ref.warn{color:var(--warn)}
  .x5t .none{font-size:var(--fs-sm);color:var(--muted);font-style:italic}
  .x5t .quote{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;display:flex;flex-direction:column;gap:2px}
  .x5t .quote .src{font-size:var(--fs-xs);color:var(--muted)}
  .x5t .quote .txt{font-size:var(--fs-sm);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
  .x5t .cnt{padding:var(--s3) var(--s4);border-top:1px solid var(--line);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .x5t .cnt.warn{background:var(--warn-bg)}
  .x5t .num{display:flex;align-items:baseline;gap:6px;font-size:var(--fs-sm);color:var(--muted)}
  .x5t .num b{font:600 var(--fs-xl)/1 var(--mono);color:var(--text)}
  .x5t .cnt.zero .num b{color:var(--muted)} .x5t .cnt.warn .num,.x5t .cnt.warn .num b{color:var(--warn)}
  .sq{display:flex;gap:4px}
  .sq span{box-sizing:border-box;width:20px;height:20px;border-radius:4px;display:grid;place-items:center;
           font:11px var(--mono);border:1px solid var(--line);color:var(--line-strong)}
  .sq span.on{font-weight:600;border:none;color:var(--surface);background:var(--muted)}
  .sq.ok span.on{background:var(--ok)} .sq.warn span.on{background:var(--warn)}
  .sq.warn span:not(.on){border-color:var(--warn-line);color:var(--warn-line)}
  .sq.mini{gap:3px} .sq.mini span{width:8px;height:8px;border-radius:2px;border-color:var(--line-strong)}
  .x5t .cap-row{grid-column:1/-1;padding:8px var(--s4);border-top:1px solid var(--line);background:var(--surface-2)}
  .x5t .rows-note{grid-column:1/-1;padding:8px var(--s4);border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--muted);line-height:1.5}
  .x5t .tool-n{padding:8px var(--s4);border-top:1px solid var(--line);font:var(--fs-sm) var(--mono);min-width:0;overflow-wrap:anywhere}
  .x5t .tool-c{padding:8px var(--s4);border-top:1px solid var(--line);border-left:1px solid var(--line);display:flex;align-items:center;gap:8px;font:var(--fs-sm) var(--mono)}
  .x5t .tool-c b{min-width:42px} .x5t .tool-c.zero{color:var(--muted)}
  .x5-each{border-top:1px solid var(--line)}
  .x5-each .hint{font-size:var(--fs-xs);color:var(--muted);padding:var(--s2) var(--s4) 0}
  .x5-each .cols{display:grid;grid-template-columns:repeat(var(--arms),minmax(0,1fr))}
  .x5-each .col{display:flex;flex-direction:column;min-width:0}
  .x5-each .col+.col{border-left:1px solid var(--line)}
  .x5-each .col-h{padding:8px var(--s4);display:flex;align-items:center;gap:8px;font:600 var(--fs-sm) var(--mono)}
  .x5-each .col-h.l{color:var(--left)} .x5-each .col-h.r{color:var(--right)}
  .run{border-top:1px solid var(--line)}
  .run-h{display:grid;grid-template-columns:28px 10px minmax(0,1fr) 14px;gap:var(--s2);align-items:center;width:100%;
         background:none;border:none;border-radius:0;padding:8px var(--s4);font:var(--fs-sm) var(--sans);text-align:left;color:var(--text)}
  .run-h .no{font:var(--fs-xs) var(--mono);color:var(--muted)}
  .run-h .pv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
  .run-h .caret{color:var(--muted)}
  .run-a{padding:0 var(--s4) var(--s3) calc(var(--s4) + 46px);display:flex;flex-direction:column;gap:6px}
  .run-a .txt{font-size:var(--fs-sm);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
  .run-a .tb{font:var(--fs-xs) var(--mono);color:var(--muted);overflow-wrap:anywhere}
  .run-a .meta-l{display:flex;gap:6px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted)}
  .x5-each .why{padding:var(--s2) var(--s4) var(--s3);font-size:var(--fs-xs);color:var(--muted);border-top:1px solid var(--line)}
  .x5-meta{padding:var(--s2) var(--s4);font:var(--fs-xs) var(--mono);color:var(--muted);border-top:1px solid var(--line)}
  .note{font-size:var(--fs-xs);color:var(--muted)}

  .drawer{width:420px;flex:none;border-left:1px solid var(--line-strong);background:var(--surface);display:flex;flex-direction:column;min-height:0}
  .drawer.adv{width:440px}
  .dr-head{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .dr-head h2{margin:0;font-size:var(--fs-lg);font-weight:600}
  .dr-body{flex:1;overflow-y:auto;padding:var(--s3) var(--s4) var(--s4);display:flex;flex-direction:column;gap:var(--s4)}
  .dr-foot{padding:var(--s3) var(--s4);border-top:1px solid var(--line);display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
  .sec{display:flex;flex-direction:column;gap:var(--s2)}
  .sec h3{margin:0;font-size:var(--fs-sm);font-weight:600}
  .sec-h{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap}
  .badge-ref{font:600 var(--fs-xs) var(--sans);background:var(--left-bg);color:var(--left);border:1px solid var(--left-line);border-radius:99px;padding:1px 9px}
  .ref table{width:100%;border-collapse:collapse;font:var(--fs-sm) var(--mono)}
  .ref th,.ref td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
  .ref th{color:var(--muted);font:var(--fs-xs) var(--sans)}
  .ref td.num,.ref th.num{text-align:right}
  .ref td:first-child{color:var(--muted)}
  .ref tr.hit td{background:var(--accent-bg);color:var(--text);font-weight:600}
  .defects{display:flex;flex-wrap:wrap;gap:6px}
  .dchip{font:var(--fs-xs) var(--mono);padding:4px 7px;border-radius:var(--r-sm);background:transparent;
         border:1px solid var(--line-strong);color:var(--muted)}
  .dchip.active{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
  .dchip.profile{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);cursor:default}
  .legend{display:flex;gap:var(--s3);flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line-strong)}
  .knobs{display:grid;grid-template-columns:auto 80px minmax(0,1fr);gap:var(--s2);align-items:center;font-size:var(--fs-sm)}
  .knobs input{width:80px;font-family:var(--mono)}
  .tree{font:var(--fs-xs) var(--mono);white-space:pre;overflow-x:auto;color:var(--muted);background:var(--bg);
        border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s2)}
  .tree .sp{cursor:pointer;color:var(--text)}
  .tree .sp:hover{color:var(--accent)}
  .tree .tool{color:var(--warn)} .tree .llm{color:var(--accent)}
  .tree .rep{color:var(--err)}
  .attrs{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s2);font:var(--fs-xs) var(--mono);
         white-space:pre-wrap;word-break:break-word;max-height:280px;overflow-y:auto;color:var(--muted)}
  .frag{font:var(--fs-xs) var(--mono);color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;
        padding-left:8px;border-left:2px solid var(--line);margin:1px 0 1px 12px}

  .overlay{position:fixed;inset:0;z-index:30;background:rgba(15,20,40,.35);display:flex;align-items:flex-start;justify-content:center;padding:6vh var(--s4)}
  .dialog{width:min(1000px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--surface);
          border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
  .overlay.full{padding:0}
  .overlay.full .dialog{width:100%;max-height:100vh;height:100%;border-radius:0}
  .dlg-head{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .dlg-head h2{margin:0;font-size:var(--fs-lg);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tabs{display:flex;gap:2px;padding:0 var(--s4);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tabs button{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;padding:10px 12px;color:var(--muted)}
  .tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
  .dlg-body{flex:1;overflow:auto;padding:var(--s4);display:grid;grid-template-columns:260px minmax(0,1fr);gap:var(--s4);align-items:start}
  .dlg-body.single{grid-template-columns:minmax(0,1fr)}
  .ov{display:flex;flex-direction:column;gap:var(--s4)}
  .ov .k{font-size:var(--fs-xs);color:var(--muted)}
  .counts{display:flex;gap:8px;font:600 var(--fs-lg) var(--mono)}
  .counts .a{color:var(--add)} .counts .d{color:var(--del)}
  .layers{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px var(--s2);font-size:var(--fs-sm)}
  .pbox-h{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2);flex-wrap:wrap;font:var(--fs-xs) var(--mono);color:var(--muted)}
  #promptBox{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s2) 0;
             font:var(--fs-xs)/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
  #promptBox .pl{display:grid;grid-template-columns:22px minmax(0,1fr);padding:0 var(--s3) 0 0}
  #promptBox .pl .g{text-align:center;color:var(--muted)}
  #promptBox .pl.add{background:var(--add-bg);color:var(--add)}
  #promptBox .pl.del{background:var(--del-bg);color:var(--del);text-decoration:line-through}
  #promptBox .pl.skip{color:var(--muted);font-style:italic}

  @media (max-width: 1100px){ .drawer{width:360px} .drawer.adv{width:380px} }
  @media (max-width: 820px){
    .top{padding:10px 14px 12px;gap:10px}
    .vsep,.brand-sub{display:none}
    .prof{flex-basis:100%;order:3;flex-direction:column;align-items:stretch}
    #profileBtn{width:100%;min-height:44px}
    #profileList{width:100%}
    .prof-desc{max-width:none}
    .chip-warn{order:4;flex-basis:100%;border-radius:var(--r-sm)}
    .spend{font-size:var(--fs-xs);flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .brand{flex:0 1 auto}
    #menuBtn,.composer button,.actions button{min-height:44px}
    .menu{width:min(330px,calc(100vw - 28px))}
    .msgs{padding:14px}
    .composer-in{padding:10px 14px 14px}
    .actrow #cmpBtn{flex:1}
    .cmp-cols,.raw,.x5-each .cols{grid-template-columns:minmax(0,1fr)}
    .x5-each .col+.col{border-left:none;border-top:1px solid var(--line)}
    .x5t{grid-template-columns:repeat(var(--arms),minmax(0,1fr))}
    .x5t .th.ans,.x5t .ans-c,.x5t .tool-n{grid-column:1/-1}
    .x5t .th.arm:nth-child(2),.x5t .cnt:nth-child(2),.x5t .tool-c:nth-child(2){border-left:none}
    .side-col+.side-col{border-left:none;border-top-width:3px}
    .dgrid{grid-template-columns:minmax(0,1fr) auto auto auto}
    .dgrid .refnote{grid-column:1/-1}
    .drawer,.drawer.adv{position:fixed;inset:0;width:auto;z-index:25;border-left:none}
    .dlg-body{grid-template-columns:minmax(0,1fr)}
    .lect{left:14px;right:14px;width:auto}
  }
</style>
</head>
<body>
<header class="top" id="top">
  <div class="brand"><span class="brand-name">PayPilot</span><span class="brand-sub" data-i18n="appSub"></span></div>
  <div class="vsep"></div>
  <div class="prof">
    <div class="prof-pick">
      <span class="lbl" data-i18n="profile"></span>
      <button id="profileBtn" aria-haspopup="listbox" aria-expanded="false" onclick="togglePop('profileList', this)"><span id="profileName">—</span><span class="caret">▼</span></button>
      <div id="profileList" class="pop" role="listbox" hidden></div>
    </div>
    <div class="prof-desc">
      <span id="profileDesc"></span>
      <a href="#" id="whatDiffers" onclick="openOverview();return false"></a>
    </div>
  </div>
  <div id="pKnobs" class="chip-warn" role="status" hidden>
    <span class="bang">!</span>
    <span><span data-i18n="changed"></span>: <span class="mono" id="knobsText"></span></span>
    <button onclick="resetMySettings()" data-i18n="reset"></button>
  </div>
  <span class="grow"></span>
  <span id="pSpend" class="spend">≈ $0.0000</span>
  <div class="menu-wrap">
    <button id="menuBtn" aria-haspopup="menu" aria-expanded="false" onclick="togglePop('menu', this)"><span data-i18n="menu"></span><span class="caret">▼</span></button>
    <div id="menu" class="pop menu" role="menu" hidden>
      <div class="mi"><span data-i18n="langLabel"></span>
        <div class="seg" role="group"><button id="langUk" onclick="setLang('uk')">УКР</button><button id="langEn" onclick="setLang('en')">EN</button></div>
      </div>
      <div class="mi"><span data-i18n="themeLabel"></span>
        <div class="seg" role="group"><button id="themeLight" onclick="setTheme('light')" data-i18n="themeLight"></button><button id="themeDark" onclick="setTheme('dark')" data-i18n="themeDark"></button></div>
      </div>
      <button class="mi" role="menuitemcheckbox" id="projBtn" aria-checked="false" onclick="toggleProjector()"><span data-i18n="projector"></span><span class="switch"></span></button>
      <button class="mi" role="menuitem" onclick="closePops();newSession()"><span><span data-i18n="newSession"></span><small data-i18n="newSessionSub"></small></span></button>
      <div class="msep"></div>
      <button class="mi" role="menuitem" onclick="closePops();openAdvanced()"><span><span data-i18n="advanced"></span><small data-i18n="advancedSub"></small></span><span class="badge" id="advBadge" hidden></span></button>
      <button class="mi" role="menuitem" onclick="closePops();openCustomers()"><span><span data-i18n="customersLink"></span><small data-i18n="customersSub"></small></span></button>
      <button class="mi" role="menuitem" onclick="closePops();openReference(lastCompareTier || customerTier())"><span><span data-i18n="reference"></span><small data-i18n="referenceSub"></small></span></button>
      <div class="msep"></div>
      <button class="mi" role="menuitem" id="lectItem" hidden onclick="closePops();togglePop('lectPop', $('menuBtn'))"><span data-i18n="lecturer"></span><span class="badge" id="lectBadge" hidden></span></button>
      <a class="mi" role="menuitem" href="/docs" target="_blank" rel="noopener"><span data-i18n="apiLink"></span><span class="caret">↗</span></a>
    </div>
  </div>
  <div id="lectPop" class="pop lect" role="dialog" hidden>
    <h3 data-i18n="lecturer"></h3>
    <div id="adminRow" class="sec">
      <span class="note" data-i18n="lockedNote"></span>
      <input type="password" id="adminInp" autocomplete="off">
      <button class="primary" style="align-self:flex-start" onclick="setAdmin()" data-i18n="signIn"></button>
    </div>
    <div id="lecturerOn" class="sec" hidden>
      <span style="color:var(--ok);font-size:var(--fs-sm)" data-i18n="lecturerOn"></span>
      <div class="danger"><button onclick="resetState()" data-i18n="resetState"></button><span data-i18n="resetStateHint"></span></div>
      <button class="link" style="align-self:flex-start" onclick="signOut()" data-i18n="signOut"></button>
    </div>
  </div>
</header>

<div class="body">
  <main class="chat">
    <div class="scroller" id="scroller"><div class="msgs" id="msgs" aria-live="polite"></div></div>
    <footer class="composer">
      <div class="composer-in">
        <div class="inrow">
          <div class="cust-wrap" id="seedBlock">
            <button id="custBtn" class="cust" aria-haspopup="listbox" aria-expanded="false" onclick="togglePop('custPop', this)"><span class="muted" data-i18n="asShort"></span><span class="mono b" id="custLabel">—</span><span class="caret">▼</span></button>
            <div id="custPop" class="pop cust-pop" role="listbox" hidden>
              <div class="cust-head">
                <b data-i18n="asCustomer"></b>
                <span class="note" data-i18n="prefixNote"></span>
                <span class="note mono" id="seedSum"></span>
              </div>
              <div class="cust-list" id="seed"></div>
            </div>
          </div>
          <input id="inp" autocomplete="off">
        </div>
        <div class="actrow">
          <button class="primary" id="cmpBtn" onclick="compare()" data-i18n="compare"></button>
          <span class="pair" id="pairView"><span class="tag-l">clean</span><span class="muted">↔</span><span class="tag-r" id="pairRight">—</span></span>
          <span class="cap" id="composerHint"></span>
          <span class="grow"></span>
          <button id="serBtn" class="x5btn mono" onclick="series()">×5</button>
          <button id="sendBtn" onclick="send()"></button>
        </div>
        <div id="samePair" class="warnline" role="alert" hidden><span class="bang">!</span><span id="samePairText"></span></div>
      </div>
    </footer>
  </main>

  <aside id="refDrawer" class="drawer" aria-labelledby="refTitle" hidden>
    <div class="dr-head">
      <h2 id="refTitle" data-i18n="refTitle"></h2>
      <span class="badge-ref" data-i18n="refBadge"></span>
      <span class="grow"></span>
      <button onclick="closeReference()" data-i18n="close"></button>
    </div>
    <div class="dr-body">
      <p class="note" style="margin:0" data-i18n="refSrc"></p>
      <div class="ref" id="ref"></div>
      <p class="note" style="margin:0" id="refClock"></p>
    </div>
  </aside>

  <aside id="advPanel" class="drawer adv" aria-labelledby="advTitle" hidden>
    <div class="dr-head">
      <h2 id="advTitle" data-i18n="advanced"></h2>
      <span class="grow"></span>
      <button onclick="closeAdvanced()" data-i18n="close"></button>
      <p class="note" style="margin:0;flex-basis:100%" data-i18n="advNote"></p>
    </div>
    <div class="dr-body">
      <div class="sec">
        <div class="sec-h"><h3 data-i18n="defectsTitle"></h3><span class="note" id="dCount"></span></div>
        <div class="defects" id="defects"></div>
        <div class="legend">
          <span><i style="background:var(--accent-bg);border-color:var(--accent)"></i><span data-i18n="lgProfile"></span></span>
          <span><i style="background:var(--warn-bg);border-color:var(--warn)"></i><span data-i18n="lgYours"></span></span>
          <span><i></i><span data-i18n="lgOff"></span></span>
        </div>
      </div>
      <div class="sec">
        <div class="sec-h"><h3 data-i18n="clockTitle"></h3><span class="note" data-i18n="clockSub"></span></div>
        <div class="row">
          <input type="text" id="clockInp" class="mono" style="flex:1" placeholder="2026-09-15T10:00:00Z">
          <button onclick="setClock(false)" data-i18n="set"></button>
          <button onclick="setClock(true)" data-i18n="reset"></button>
        </div>
      </div>
      <div class="sec">
        <div class="sec-h"><h3 data-i18n="memTitle"></h3><span class="note" data-i18n="memSub"></span></div>
        <div class="knobs">
          <span data-i18n="sumLabel"></span><input type="text" id="sumInp" inputmode="numeric"><span class="note" id="sumNote"></span>
          <span>top_k</span><input type="text" id="topkInp" inputmode="numeric"><span class="note" id="topkNote"></span>
          <span data-i18n="idxLabel"></span>
          <select id="idxSel" style="grid-column:span 2">
            <option value="" data-i18n="idxByProfile"></option>
            <option value="kb_clean">kb_clean</option>
            <option value="kb_broken">kb_broken</option>
          </select>
        </div>
        <div class="row">
          <button onclick="setSummarize()" data-i18n="setSum"></button>
          <button onclick="setRetrieval()" data-i18n="setSearch"></button>
        </div>
        <span class="note" data-i18n="memHint"></span>
      </div>
      <div class="sec">
        <h3 data-i18n="standTitle"></h3>
        <span class="note" id="standInfo"></span>
        <span class="note" id="scopeHint"></span>
        <div class="danger" id="resetBox" hidden><button id="resetBtn" onclick="resetState()" data-i18n="resetState"></button><span data-i18n="resetStateHint"></span></div>
      </div>
      <div class="sec" id="traceSec">
        <h3><span data-i18n="traceTitle"></span> <span class="mono muted" id="traceId"></span></h3>
        <div class="tree" id="tree"></div>
        <div class="attrs" id="attrs" hidden></div>
      </div>
    </div>
    <div class="dr-foot">
      <button onclick="resetMySettings()" data-i18n="defaults"></button>
      <span class="note" data-i18n="defaultsSub"></span>
    </div>

const SETTINGS_KEY = 'paypilot.settings', ADMIN_KEY = 'paypilot.admin';
const UI_KEY = 'paypilot.ui';
function readStore(key, fallback){
  try{ const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
  catch(_){ return fallback; }
}
function writeStore(key, value){
  try{
    if(value === null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(value));
  }catch(_){}
}
let settings = readStore(SETTINGS_KEY, {}) || {};
let adminToken = readStore(ADMIN_KEY, '') || '';
let ui = Object.assign({lang: 'uk', theme: '', projector: false, customer: ''}, readStore(UI_KEY, {}) || {});

function saveUi(){ writeStore(UI_KEY, ui); }
function t(key, vars){
  const d = I18N[ui.lang] || I18N.uk;
  let s = d[key] !== undefined ? d[key] : I18N.uk[key];
  if(typeof s === 'string' && vars){
    Object.keys(vars).forEach(function(k){ s = s.split('{' + k + '}').join(vars[k]); });
  }
  return s === undefined ? key : s;
}

function el(tag, props, kids){
  const n = document.createElement(tag);
  Object.keys(props || {}).forEach(function(k){
    const v = props[k];
    if(v === undefined || v === null || v === false) return;
    if(k === 'text') n.textContent = v;
    else if(k === 'cls') n.className = v;
    else if(k.indexOf('on') === 0) n[k] = v;
    else n.setAttribute(k, v === true ? '' : v);
  });
  (kids || []).forEach(function(c){
    if(c === null || c === undefined || c === false) return;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return n;
}

function saveSettings(){ writeStore(SETTINGS_KEY, settings); }
function withSetting(key, value){
  const next = Object.assign({}, settings);
  if(value === null || value === undefined || value === '') delete next[key];
  else next[key] = value;
  return next;
}
async function applySettings(next){
  const h = await api('/health', {headers: {'X-Stand-Settings': JSON.stringify(next)}});
  settings = next;
  saveSettings();
  return h;
}
function recoverSettings(message){
  if(!/X-Stand-Settings/.test(message) || !Object.keys(settings).length) return false;
  settings = {};
  saveSettings();
  addMsg(t('recovered', {m: message}), 'err');
  return true;
}
function settingsHeaders(){
  const h = {};
  if(Object.keys(settings).length) h['X-Stand-Settings'] = JSON.stringify(settings);
  if(adminToken) h['X-Stand-Admin'] = adminToken;
  return h;
}
function freshSession(reason){
  sessionId = null;
  lastStep = 0;
  addMsg(t('freshSession', {r: reason}), 'sys');
}

async function api(path, opts){
  opts = Object.assign({}, opts || {});
  const headers = Object.assign({}, settingsHeaders(), opts.headers || {});
  opts.headers = headers;
  const r = await fetch(path, opts);
  if(!r.ok){
    const body = await r.text();
    let msg = body.slice(0,300);
    try{ const j = JSON.parse(body); if(j && j.detail) msg = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail); }catch(_){}
    const err = new Error(msg);
    err.status = r.status;
    throw err;
  }
  return r.json();
}

function fail(e){ addMsg(t('failPrefix') + ': ' + e.message, 'err'); }

function jpost(body){
  return {method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify(body)};
}
function jput(body){
  return {method:'PUT', headers:{'Content-Type':'application/json'},
          body: JSON.stringify(body)};
}

function renderRich(text, el){
  const re = /\*\*([^*]+)\*\*|`([^`]+)`/g;
  let last = 0, m;
  while((m = re.exec(text)) !== null){
    if(m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
    const tag = document.createElement(m[1] !== undefined ? 'strong' : 'code');
    tag.textContent = m[1] !== undefined ? m[1] : m[2];
    el.appendChild(tag);
    last = re.lastIndex;
  }
  if(last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
  return el;
}

function addMsg(text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  return appendNode(d);
}

function appendNode(node){
  const empty = $('emptyState');
  const conversational = /\b(user|card)\b/.test(node.className);
  if(empty && conversational) empty.remove();
  if(empty && !conversational) $('msgs').insertBefore(node, empty);
  else $('msgs').appendChild(node);
  scrollEnd();
  return node;
}
function scrollEnd(){ $('scroller').scrollTop = $('scroller').scrollHeight; }

function addUser(text, cust){
  const d = el('div', {cls: 'msg user'});
  if(cust) d.appendChild(el('span', {cls: 'cust-tag', text: t('asShort') + ' ' + cust}));
  d.appendChild(document.createTextNode(text));
  return appendNode(d);
}

function copyText(text, btn){
  const done = function(){
    if(!btn) return;
    const was = btn.textContent;
    btn.textContent = t('copied');
    setTimeout(function(){ btn.textContent = was; }, 1400);
  };
  try{
    if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done, function(){ legacyCopy(text); done(); }); return; }
  }catch(_){}
  legacyCopy(text);
  done();
}
function legacyCopy(text){
  const ta = el('textarea', {style: 'position:fixed;opacity:0'});
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(_){}
  ta.remove();
}

function composeMessage(text){
  return {message: text, cust: ui.customer || ''};
}

function withCustomer(body){
  if(ui.customer) body.customer_id = ui.customer;
  return body;
}

function startWaiting(bubble, controller){
  const started = Date.now();
  bubble.textContent = '';
  const line = el('div', {cls: 'wait'}, [el('span', {cls: 'dots'}, [el('i'), el('i'), el('i')]), el('span', {text: '…'})]);
  bubble.appendChild(line);
  const label = line.lastChild;
  let stuck = null;
  const tick = setInterval(function(){
    const s = Math.round((Date.now() - started) / 1000);
    if(s >= 8) label.textContent = t('waiting') + ' · ' + s + ' ' + t('sec');
    if(s >= 25 && !stuck){
      stuck = el('div', {cls: 'stuck', role: 'status'}, [
        el('b', {text: t('waiting25')}),
        el('span', {}, [t('waitingHint') + ' ', el('code', {text: 'python scripts/doctor.py'})]),
        el('div', {cls: 'row'}, [
          el('button', {text: t('keepWaiting'), onclick: function(){ stuck.hidden = true; }}),
          el('button', {text: t('cancel'), onclick: function(){ controller.abort(); }})])]);
      bubble.appendChild(stuck);
      scrollEnd();
    }
  }, 1000);
  return function(){ clearInterval(tick); };
}

function errorBlock(holder, e, retry){
  holder.className = 'alert';
  holder.setAttribute('role', 'alert');
  holder.textContent = '';
  const aborted = e.name === 'AbortError';
  if(aborted) addSpend(null);
  holder.appendChild(el('b', {text: aborted ? t('cancelled') : t('errTitle')}));
  if(!aborted){
    holder.appendChild(el('span', {cls: 'mono', text: (e.status ? 'HTTP ' + e.status + ' · ' : '') + e.message}));
    if(/balance|credit|api key|api_key|401|authenticat|quota/i.test(e.message)) holder.appendChild(el('span', {text: t('errBalance')}));
  }
  holder.appendChild(el('div', {cls: 'row'}, [
    retry ? el('button', {text: t('retry'), onclick: function(){ holder.remove(); retry(); }}) : null,
    aborted ? null : el('button', {text: t('copyErr'), onclick: function(){ copyText(e.message, this); }})]));
}

function metaLine(side, onTrace){
  const u = side.usage || {};
  const m = el('div', {cls: 'meta'});
  const secs = side.elapsed_ms != null ? (side.elapsed_ms / 1000).toFixed(1) + ' ' + t('sec') : '';
  const cost = u.cost_usd == null ? t('priceUnknown') : '≈ ' + fmtUsd(u.cost_usd);
  const first = el('span', {text: cost + (secs ? ' · ' + secs : '')});
  if(u.cost_usd == null) first.title = t('priceUnknownTip');
  m.title = 'tokens in ' + u.input_tokens + ' · out ' + u.output_tokens + ' · ' + t('promptV') + ' ' +
    side.prompt_version + ' · ' + t('step') + ' ' + side.step_number + ' · ' + t('model') + ' ' + (side.model || u.model || '—');
  m.appendChild(first);
  m.appendChild(el('span', {text: '·'}));
  const a = el('a', {text: t('trace') + ' ' + side.request_id.slice(0, 8), onclick: function(){ onTrace(side.request_id); }});
  m.appendChild(a);
  m.appendChild(el('button', {cls: 'quiet', text: t('copy'), onclick: function(){ copyText(side.request_id, this); }}));
  return m;
}

function openTrace(id){
  openAdvanced();
  loadTrace(id);
  $('traceSec').scrollIntoView({block: 'start'});
}

async function send(retryText){
  const inp = $('inp'), text = typeof retryText === 'string' ? retryText : inp.value.trim();
  if(!text){ inp.focus(); return; }
  inp.value = '';
  const composed = composeMessage(text);
  addUser(text, composed.cust);
  $('sendBtn').disabled = true;
  const thinking = addMsg('…', 'bot');
  const controller = new AbortController();
  const stopWaiting = startWaiting(thinking, controller);
  try{
    const res = await api('/chat', Object.assign(jpost(withCustomer({message: composed.message, session_id: sessionId})), {signal: controller.signal}));
    sessionId = res.session_id;
    lastStep = res.step_number;
    stopWaiting();
    thinking.textContent = '';
    renderRich(res.answer || t('emptyAnswer'), thinking);
    const u = res.usage || {};
    thinking.appendChild(metaLine({usage: u, elapsed_ms: res.elapsed_ms, prompt_version: res.prompt_version,
      step_number: res.step_number, request_id: res.request_id, model: u.model}, openTrace));
    addSpend(u.cost_usd);
    loadTrace(res.request_id);
    renderComposerHint();
  }catch(e){
    stopWaiting();
    errorBlock(thinking, e, function(){ send(text); });
  }finally{
    $('sendBtn').disabled = false;
    inp.focus();
  }
}

let spentUsd = 0, spentUnpriced = 0;

function costPart(c){

function addSpend(c){

function turnsWord(n){
  const w = t('turnsWord');
  if(n % 10 === 1 && n % 100 !== 11) return w[0];
  if(n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) return w[1];
  return w[2];
}

function armName(){
  const pins = Array.from(extraDefects);

function fmtClock(iso){ return (iso || '—').slice(0, 16).replace('T', ' '); }

function conditionRows(d){
  const c = d.clean, p = d.profile;
  const defectsOf = function(s){ return s.active_defects.length ? s.active_defects.join(', ') : t('none'); };
  const promptOf = function(s){ return (s.prompt_version || '—').replace(/\+/g, ' +'); };
  const sessionOf = function(s){ return s.step_number === 1 ? t('newNoHistory') : t('step') + ' ' + s.step_number; };
  const retrievalOf = function(s){ return s.retrieval ? s.retrieval.index + ' / top_k ' + s.retrieval.top_k : '—'; };
  return [
    [t('cProfile'), c.profile, p.profile],
    [t('cDefects'), defectsOf(c), defectsOf(p)],
    [t('cPrompt'), promptOf(c), promptOf(p)],
    [t('cSession'), sessionOf(c), sessionOf(p)],
    [t('cClock'), fmtClock(c.clock), fmtClock(p.clock)],
    [t('cIndex'), retrievalOf(c), retrievalOf(p)],
    [t('cModel'), c.model || '—', p.model || '—'],
    [t('cRouter'), c.router || t('cRouterNone'), p.router || t('cRouterNone')],
  ];
}

function renderConditions(d){
  const tb = el('table', {cls: 'cond'});
  const head = tb.insertRow();
  [t('conditions'), d.clean.profile, d.profile.profile, ''].forEach(function(h){
    head.appendChild(el('th', {text: h}));
  });
  const differing = [];
  conditionRows(d).forEach(function(row){
    const tr = tb.insertRow();
    const same = row[1] === row[2];
    if(!same){ tr.className = 'diffrow'; differing.push(row); }
    row.forEach(function(v){ tr.insertCell().textContent = v; });
    const mark = tr.insertCell();
    mark.className = 'mark';
    mark.textContent = same ? t('eq') : t('neq');
  });
  return {table: tb, differing: differing};
}

function verdictText(d, differing, textSame, toolDiffs, firstDiff){
  const p = d.profile, c = d.clean;
  let state = 'diff', out;
  if(toolDiffs == null){ out = t('vUnknown', {t: textSame ? t('vTextSame') : t('vTextDiff')}); state = textSame ? 'same' : 'diff'; }
  else if(textSame && !toolDiffs){ out = t('vSame'); state = 'same'; }
  else if(textSame) out = t('vPayloadOnly');
  else if(!toolDiffs) out = t('vTextOnly');
  else out = firstDiff ? t('vBoth', {f: firstDiff}) : t('vBothShort');
  const names = differing.map(function(r){ return r[0]; }).filter(function(n){ return n !== t('cProfile') && n !== t('cDefects'); });
  if(names.length) out += ' ' + t('vInputs', {d: names.join(', ')});
  if(state === 'diff' && c.prompt_version === p.prompt_version && p.active_defects.length){
    out += ' ' + t('vPromptSame', {d: p.active_defects.join(', ')});
  }
  return {state: state, text: out};
}

function inlineTokens(text){
  const re = /\*\*([^*]+)\*\*|`([^`]+)`/g;
  const out = [];
  const push = function(chunk, style){
    chunk.split(/(\s+)/).forEach(function(tk){ if(tk) out.push({text: tk, style: style}); });
  };
  let last = 0, m;
  while((m = re.exec(text)) !== null){
    if(m.index > last) push(text.slice(last, m.index), null);
    if(m[1] !== undefined) push(m[1], 'strong'); else push(m[2], 'code');
    last = re.lastIndex;
  }
  if(last < text.length) push(text.slice(last), null);
  return out;
}

const DIFF_TOKEN_LIMIT = 400;

function wordDiff(a, b){
  const n = a.length, m = b.length;
  if(n > DIFF_TOKEN_LIMIT || m > DIFF_TOKEN_LIMIT){
    const words = function(ts){ return ts.filter(function(x){ return x.text.trim(); }).map(function(x){ return x.text; }).join(' '); };
    return {left: a.map(function(x){ return {tok: x, op: 'same'}; }),
            right: b.map(function(x){ return {tok: x, op: 'same'}; }),
            skipped: true, changed: words(a) !== words(b)};
  }
  const dp = [];
  for(let i = 0; i <= n; i++) dp.push(new Uint16Array(m + 1));
  for(let i = n - 1; i >= 0; i--){
    for(let j = m - 1; j >= 0; j--){
      dp[i][j] = a[i].text === b[j].text
        ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  const left = [], right = [];
  let i = 0, j = 0, changed = false;
  while(i < n && j < m){
    if(a[i].text === b[j].text){
      left.push({tok: a[i], op: 'same'}); right.push({tok: b[j], op: 'same'}); i++; j++;
    }else if(dp[i + 1][j] >= dp[i][j + 1]){
      left.push({tok: a[i], op: 'del'}); changed = changed || !!a[i].text.trim(); i++;
    }else{
      right.push({tok: b[j], op: 'add'}); changed = changed || !!b[j].text.trim(); j++;
    }
  }
  while(i < n){ left.push({tok: a[i], op: 'del'}); changed = changed || !!a[i].text.trim(); i++; }
  while(j < m){ right.push({tok: b[j], op: 'add'}); changed = changed || !!b[j].text.trim(); j++; }
  return {left: left, right: right, skipped: false, changed: changed};
}

function renderMarked(marked, box, highlight){
  box.textContent = '';
  marked.forEach(function(m){
    let node;
    if(m.tok.style){
      node = document.createElement(m.tok.style);
      node.textContent = m.tok.text;
    }else{
      node = document.createTextNode(m.tok.text);
    }
    if(highlight && m.op !== 'same' && m.tok.text.trim()){
      const w = document.createElement('span');
      w.className = m.op === 'add' ? 'dadd' : 'ddel';
      w.appendChild(node);
      node = w;
    }
    box.appendChild(node);
  });
}

function toolSummary(arm){
  const parts = Object.keys(arm.tool_counts).sort().map(function(name){
    return name + ' ' + arm.tool_counts[name] + '/' + arm.runs.length;
  });
  return parts.length ? parts.join(' · ') : t('noToolsCalled');
}

const OUTCOME_KEYS = {fx: 'x5OutFx', limits: 'x5OutLimits', asked: 'x5OutAsked', escalated: 'x5OutEscalated', error: 'x5OutError', answered: 'x5OutAnswered'};
const KIND_KEYS = {receives: 'x5KindReceives', spread: 'x5KindSpread', dailyLeft: 'x5KindDailyLeft', monthlyLeft: 'x5KindMonthlyLeft'};

function fmtValue(v){
  const pct = v.unit === '%';
  const n = Number(v.value).toLocaleString('en-US', {minimumFractionDigits: pct ? 0 : 2, maximumFractionDigits: 2});
  return pct ? n + '%' : n + ' ' + v.unit;
}

function rowText(row){
  const vals = row.values.map(function(v){ return (KIND_KEYS[v.kind] ? t(KIND_KEYS[v.kind]) : '') + fmtValue(v); });
  return [t(OUTCOME_KEYS[row.outcome] || 'x5OutAnswered')].concat(vals).join(' · ');
}

function rowTone(row, armKeys){
  if(row.reference) return row.reference.ok ? 'ok' : 'warn';
  if(armKeys.length > 1 && row.arms[armKeys[0]].count === 0) return 'warn';
  return '';
}

function changedKinds(rows, idx){
  const row = rows[idx];
  const prev = rows.slice(0, idx).filter(function(r){ return r.outcome === row.outcome; })[0];
  if(!prev) return [];
  return row.values.filter(function(v){
    return prev.values.some(function(p){ return p.kind === v.kind && (p.value !== v.value || p.unit !== v.unit); });
  }).map(function(v){ return v.kind; });
}

function squares(runs, n, tone, mini){
  const on = runs.map(Number);
  const items = [];
  for(let i = 1; i <= n; i++) items.push(el('span', {cls: on.indexOf(i) >= 0 ? 'on' : '', text: mini ? '' : String(i)}));
  return el('span', {cls: 'sq' + (tone ? ' ' + tone : '') + (mini ? ' mini' : ''), 'aria-label': t('x5RunsAria', {l: on.join(', ')})}, items);
}

function seriesVerdict(rows, arms, armKeys){
  const n = arms[armKeys[0]].runs.length;
  if(armKeys.length < 2) return {state: 'same', text: t('x5Single', {n: n})};
  const base = armKeys[0], cur = armKeys[1];
  const pb = armLabel(arms[base]), pc = armLabel(arms[cur]);
  const parts = [];
  const moved = rows.filter(function(r){ return r.arms[base].count !== r.arms[cur].count; });
  if(moved.length){
    const top = moved.slice().sort(function(x, y){
      return (y.arms[cur].count - y.arms[base].count) - (x.arms[cur].count - x.arms[base].count);
    })[0];
    const k = top.arms[cur].count, j = top.arms[base].count;
    if(j === 0 && k > 0) parts.push(t('x5VerdictNew', {p: pc, k: k, n: n, a: rowText(top), b: pb}) + (k >= n - 1 ? t('x5Stable') : t('x5Maybe')));
    else parts.push(t('x5VerdictShift', {a: rowText(top), p: pc, k: k, n: n, b: pb, j: j}));
  }
  const tools = Object.keys(Object.assign({}, arms[base].tool_counts, arms[cur].tool_counts)).sort();
  const toolParts = [];
  tools.forEach(function(name){
    const x = arms[base].tool_counts[name] || 0, y = arms[cur].tool_counts[name] || 0;
    if(x !== y) toolParts.push(t('x5Tools', {t: name, a: x + '/' + n, b: y + '/' + n}));
  });
  if(toolParts.length) parts.push(toolParts.join('; ') + '.');
  return parts.length ? {state: 'diff', text: parts.join(' ')} : {state: 'same', text: t('x5VerdictSame', {n: n})};
}

      rows.forEach(function(row){

function compareEvidence(question, d, verdict, differing, rows){
  const lines = [t('evQuestion') + ': ' + question, d.clean.profile + ' ↔ ' + d.profile.profile + ' · ' + fmtClock(d.clean.clock), verdict, ''];
  [['clean', d.clean], ['profile', d.profile]].forEach(function(p){
    lines.push(p[1].profile + ' · ' + t('evTrace') + ' ' + p[1].request_id + ' · ' + t('promptV') + ' ' + p[1].prompt_version);
    lines.push(p[1].answer || '');
    lines.push('');
  });
  lines.push(t('evConditions') + ':');
  if(!differing.length) lines.push('  ' + t('evNone'));
  differing.forEach(function(r){ lines.push('  ' + r[0] + ': ' + r[1] + ' → ' + r[2]); });
  lines.push(t('evDiffs') + ':');
  if(!rows || !rows.length) lines.push('  ' + t('evNone'));
  (rows || []).forEach(function(r){ lines.push('  ' + r[0] + ' · ' + r[1] + ': ' + r[2] + ' → ' + r[3]); });
  return lines.join('\n');
}

function toolIndex(tree){
  const out = {};
  (function walk(n){
    if(n.name && n.name.indexOf('tool.') === 0){
      const a = n.attributes || {};
      const key = n.name + ' ' + JSON.stringify(a['tool.arguments'] || {});
      if(!(key in out)) out[key] = a['tool.result'];
    }
    (n.children || []).forEach(walk);
  })(tree);
  return out;
}

function flatten(v, prefix, into){
  if(v && typeof v === 'object' && !Array.isArray(v)){
    Object.keys(v).forEach(function(k){ flatten(v[k], prefix ? prefix+'.'+k : k, into); });
  }else{
    into[prefix] = JSON.stringify(v);
  }
  return into;
}

const CELL_LIMIT = 160;

function clip(v, limit){
  v = String(v);
  return v.length > limit ? v.slice(0, limit - 1) + '…' : v;
}

function toolLabel(key){
  const name = key.split(' ')[0].slice(5);
  const args = key.slice(key.indexOf(' ') + 1);
  return name + (args === '{}' ? '()' : '(' + clip(args, 48) + ')');
}

function refHint(field, ra, rb){
  if(!reference) return '';
  const src = Object.assign({}, rb || {}, ra || {});
  const leaf = field.split('.').pop();
  const tier = src.tier;
  let v;
  if(leaf === 'spread_pct' && tier && src.allowance_applied === false) v = reference.FX_SPREAD_PCT[tier];
  else if(leaf === 'daily_limit_eur' && tier) v = reference.DAILY_LIMIT_EUR[tier];
  else if(leaf === 'monthly_limit_eur' && tier) v = reference.MONTHLY_LIMIT_EUR[tier];
  else if(leaf === 'allowance_total_eur' && tier) v = reference.FX_FREE_MONTHLY_ALLOWANCE_EUR[tier];
  else if(leaf === 'window_days' && src.reason_code) v = reference.DISPUTE_WINDOWS_DAYS[src.reason_code];
  else if((leaf === 'flat_fee_eur' || leaf === 'percent_fee') && src.transfer_type && reference.TRANSFER_FEES[src.transfer_type]) v = reference.TRANSFER_FEES[src.transfer_type][leaf];
  if(v === undefined) return '';
  const k = leaf === 'window_days' ? src.reason_code : leaf.indexOf('fee') >= 0 ? src.transfer_type : tier;
  return t('refFor', {k: k, v: v});
}

async function showPayloadDiff(note, cleanId, dirtyId, d, rawBox){
  note.textContent = '';
  note.appendChild(el('strong', {text: t('whatDiffered')}));
  const status = el('span', {cls: 'note', text: t('diffChecking')});
  note.appendChild(status);
  try{
    const a = toolIndex(await api('/api/_test/traces/' + cleanId));
    const b = toolIndex(await api('/api/_test/traces/' + dirtyId));
    const rows = [];
    let tier = '';
    Object.keys(b).forEach(function(key){
      if(b[key] && b[key].tier) tier = tier || b[key].tier;
      if(!(key in a)){ rows.push([toolLabel(key), '—', t('notCalled'), t('called'), '']); return; }
      const fa = flatten(a[key], '', {}), fb = flatten(b[key], '', {});
      Object.keys(fb).forEach(function(f){
        if(fa[f] !== fb[f]) rows.push([toolLabel(key), f, fa[f] === undefined ? '—' : fa[f], fb[f], refHint(f, a[key], b[key])]);
      });
      Object.keys(fa).forEach(function(f){
        if(!(f in fb)) rows.push([toolLabel(key), f, fa[f], '—', '']);
      });
    });
    Object.keys(a).forEach(function(key){
      if(a[key] && a[key].tier) tier = tier || a[key].tier;
      if(!(key in b)) rows.push([toolLabel(key), '—', t('called'), t('notCalled'), '']);
    });
    const toolRows = rows.length;
    if(d.clean.prompt_version !== d.profile.prompt_version) rows.push([t('fPrompt'), '', d.clean.prompt_version, d.profile.prompt_version, '']);
    status.remove();
    if(!rows.length) note.appendChild(el('span', {cls: 'note', text: t('sameAll')}));
    else{
      const g = el('div', {cls: 'dgrid'});
      rows.slice(0, 12).forEach(function(r){
        const field = r[1] ? r[0] + ' · ' + r[1] : r[0];
        g.appendChild(el('span', {cls: 'muted', text: clip(field, 80), title: field}));
        g.appendChild(el('span', {cls: 'vl', text: clip(r[2], CELL_LIMIT), title: String(r[2]).length > CELL_LIMIT ? String(r[2]) : null}));
        g.appendChild(el('span', {cls: 'muted', text: '→'}));
        g.appendChild(el('span', {cls: 'vr', text: clip(r[3], CELL_LIMIT), title: String(r[3]).length > CELL_LIMIT ? String(r[3]) : null}));
        g.appendChild(el('span', {cls: 'refnote', text: r[4] || ''}));
      });
      note.appendChild(g);
      if(rows.length > 12) note.appendChild(el('span', {cls: 'note', text: t('moreRows', {n: rows.length - 12})}));
    }
    renderRaw(rawBox, a, b);
    return {count: toolRows, first: rows.length && rows[0][1] ? rows[0][1] + ' ' + rows[0][2] + ' → ' + rows[0][3] : '', rows: rows, tier: tier};
  }catch(e){
    status.textContent = t('diffFail', {m: e.message});
    return {count: null, first: '', rows: [], tier: ''};
  }
}

function renderRaw(box, a, b){
  box.textContent = '';
  const names = Object.keys(Object.assign({}, a, b)).map(function(k){ return k.split(' ')[0].slice(5); });
  box.appendChild(el('span', {cls: 'sub-h', text: t('rawPayloads') + (names.length ? ' · ' + names.filter(function(n, i){ return names.indexOf(n) === i; }).join(', ') : '')}));

    const keys = Object.keys(idx);
    if(!keys.length) return t('noTools');
    return keys.map(function(k){ return toolLabel(k) + ' → ' + JSON.stringify(idx[k], null, 1); }).join('\n\n');
  };
  box.appendChild(el('div', {cls: 'raw'}, [el('pre', {cls: 'l', text: fmt(a)}), el('pre', {cls: 'r', text: fmt(b)})]));
}

function renderTree(tree){
  const box = $('tree');
  box.textContent = '';
  const seen = {};
  const walk = function(n, depth, path){
    const line = document.createElement('div');
    const span = document.createElement('span');
    let cls = 'sp';
    if(n.name.indexOf('tool.') === 0) cls += ' tool';
    else if(n.name === 'llm.call') cls += ' llm';
    span.className = cls;
    span.textContent = '  '.repeat(depth) + n.name;
    const p = path.slice();
    span.onclick = function(){ showAttrs(p); };
    line.appendChild(span);

    const a = n.attributes || {};
    let note = '', rep = false;
    if(n.name === 'llm.call' && a['agent.loop_step'] !== undefined){
      const step = String(a['agent.loop_step']);
      if(step.indexOf('retry-') === 0){
        note = t('retryN', {n: step.slice(6)});
        rep = true;
      }else{
        note = t('step') + ' ' + step;
      }
    }
    if(n.name.indexOf('tool.') === 0){
      const key = n.name + ' ' + JSON.stringify(a['tool.arguments'] || {});
      seen[key] = (seen[key] || 0) + 1;
      if(seen[key] > 1){
        note = t('sameArgs', {n: seen[key] - 1});
        rep = true;
      }else if(a['retrieval.index']){
        note = a['retrieval.index'] + ' / top_k ' + a['retrieval.top_k'];
      }
    }
    if(note) line.appendChild(el('span', {cls: rep ? 'rep' : '', text: '  ' + note}));
    if(n.duration_ms != null) line.appendChild(el('span', {text: '  ' + n.duration_ms + 'ms'}));
    box.appendChild(line);
    (a['retrieval.fragments'] || []).forEach(function(f){
      box.appendChild(el('div', {cls: 'frag', text: '  '.repeat(depth + 1) + f.id + ' · ' + f.score + ' · ' + (f.text || '')}));
    });
    if(a['retrieval.index'] && !(a['retrieval.fragments'] || []).length){
      box.appendChild(el('div', {cls: 'frag', text: '  '.repeat(depth + 1) + t('noFrag')}));
    }
    (n.children || []).forEach(function(c, i){ walk(c, depth + 1, path.concat(i)); });
  };
  walk(tree, 0, []);
  $('attrs').hidden = true;
}

function showAttrs(path){
  let node = lastTrace;
  for(const i of path) node = node.children[i];
  $('attrs').hidden = false;
  $('attrs').textContent = JSON.stringify(node.attributes, null, 2);
}

function lineDiff(a, b){
  const n = a.length, m = b.length, dp = [];
  for(let i = 0; i <= n; i++) dp.push(new Uint16Array(m + 1));
  for(let i = n - 1; i >= 0; i--){
    for(let j = m - 1; j >= 0; j--){
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  const out = [];
  let i = 0, j = 0;
  while(i < n && j < m){
    if(a[i] === b[j]){ out.push({op: 'same', text: a[i]}); i++; j++; }
    else if(dp[i + 1][j] >= dp[i][j + 1]){ out.push({op: 'del', text: a[i]}); i++; }
    else{ out.push({op: 'add', text: b[j]}); j++; }
  }
  while(i < n){ out.push({op: 'del', text: a[i]}); i++; }
  while(j < m){ out.push({op: 'add', text: b[j]}); j++; }
  return out;
}

function withContext(lines, around){
  const keep = lines.map(function(){ return false; });
  lines.forEach(function(l, i){
    if(l.op === 'same') return;
    for(let k = Math.max(0, i - around); k <= Math.min(lines.length - 1, i + around); k++) keep[k] = true;
  });
  const out = [];
  let skipped = 0;
  lines.forEach(function(l, i){
    if(keep[i]){
      if(skipped) out.push({op: 'skip', text: t('sameLines', {n: skipped})});
      skipped = 0;
      out.push(l);
    }else skipped += 1;
  });
  if(skipped) out.push({op: 'skip', text: t('sameLines', {n: skipped})});
  return out;
}

    const tx = document.createElement('span');
    tx.textContent = l.text || ' ';
    row.appendChild(g);
    row.appendChild(tx);
    box.appendChild(row);
  });
}
