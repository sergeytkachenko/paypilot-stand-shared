{{- if .Values.cloudflared.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cloudflared
  labels:
    {{- include "paypilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "paypilot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cloudflared
  template:
    metadata:
      labels:
        {{- include "paypilot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cloudflared
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/cloudflared-config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: "{{ .Values.cloudflared.image.repository }}:{{ .Values.cloudflared.image.tag }}"
          args: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yaml", "run"]
          securityContext:
            {{- include "paypilot.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.cloudflared.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: credentials
              mountPath: /etc/cloudflared/credentials.json
              subPath: credentials.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-cloudflared
        - name: credentials
          secret:
            secretName: {{ .Values.cloudflared.secretName }}
{{- end }}
